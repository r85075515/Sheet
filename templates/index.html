<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sheet</title>
  <style>
    :root {
      --bg: #f3f2f1;
      --panel: #ffffff;
      --line: #e1dfdd;
      --line-strong: #c8c6c4;
      --text: #323130;
      --muted: #605e5c;
      --accent: #0f6cbd;
      --accent-soft: #deecf9;
      --header: #faf9f8;
      --cell-h: 28px;
      --col-w: 110px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 13px;
      height: 100%;
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-rows: 36px 38px 66px 38px 1fr 36px 26px;
      height: 100vh;
    }

    /* Window/title bar */
    .titlebar {
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
    }
    .title-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .excel-dot {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      background: #107c41;
      display: inline-block;
    }
    .book-title {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 460px;
    }
    .search-wrap {
      display: flex;
      justify-content: center;
      min-width: 0;
    }
    .search {
      width: min(560px, 100%);
      border: 1px solid var(--line);
      border-radius: 4px;
      height: 28px;
      padding: 0 10px;
      color: var(--muted);
      background: #fff;
      display: flex;
      align-items: center;
    }
    .title-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chip {
      border: 1px solid var(--line);
      padding: 4px 8px;
      border-radius: 4px;
      background: #fff;
      font-size: 12px;
    }
    .share-btn {
      background: #107c41;
      color: #fff;
      border: 1px solid #107c41;
      border-radius: 4px;
      padding: 5px 10px;
      font-weight: 600;
    }

    /* Ribbon tabs */
    .tabs-row {
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: end;
      padding: 0 10px;
      gap: 2px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .rtab {
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      padding: 8px 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .rtab.active {
      color: var(--text);
      background: #fff;
      border-color: var(--line);
      font-weight: 600;
    }

    /* Ribbon content */
    .ribbon {
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: stretch;
      gap: 8px;
      padding: 6px 10px;
      overflow-x: auto;
    }
    .group {
      border-right: 1px solid var(--line);
      padding-right: 10px;
      min-width: max-content;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 4px;
    }
    .group:last-child { border-right: none; }
    .group-body {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-height: 40px;
    }
    .group-label {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      user-select: none;
    }
    .btn {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
    }
    .btn.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    /* Formula bar */
    .formula-row {
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 84px 26px 1fr;
      gap: 6px;
      align-items: center;
      padding: 5px 10px;
    }
    #nameBox, #formulaInput {
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 0 8px;
      font-size: 13px;
      background: #fff;
      color: var(--text);
    }
    .fx {
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8a8886;
      background: #fff;
      font-style: italic;
      font-weight: 600;
    }

    /* Grid */
    .sheet-area {
      margin: 0;
      background: var(--panel);
      overflow: auto;
      border-bottom: 1px solid var(--line);
    }
    table {
      border-collapse: collapse;
      width: max-content;
      min-width: 100%;
      table-layout: fixed;
    }
    th, td {
      border: 1px solid #eceae8;
      height: var(--cell-h);
      min-width: var(--col-w);
      max-width: var(--col-w);
      width: var(--col-w);
      padding: 0;
      background: #fff;
      vertical-align: middle;
    }
    th {
      background: var(--header);
      position: sticky;
      top: 0;
      z-index: 4;
      text-align: center;
      font-size: 12px;
      color: #3b3a39;
      font-weight: 600;
    }
    th.corner {
      min-width: 44px;
      max-width: 44px;
      width: 44px;
      left: 0;
      z-index: 5;
    }
    td.row-h {
      min-width: 44px;
      max-width: 44px;
      width: 44px;
      position: sticky;
      left: 0;
      z-index: 3;
      background: var(--header);
      text-align: right;
      color: #3b3a39;
      padding-right: 8px;
      font-size: 12px;
      user-select: none;
    }
    td.cell input {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      padding: 0 8px;
      font-size: 13px;
      color: var(--text);
      background: transparent;
    }
    td.cell input:focus {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
      background: #fff;
    }

    /* Sheet tabs */
    .tabs-strip {
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .sheet-tab {
      border: 1px solid var(--line);
      background: #f8f8f8;
      border-radius: 4px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }
    .sheet-tab.active {
      background: #fff;
      color: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }

    /* Status bar */
    .status {
      background: #fff;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      border-top: 1px solid var(--line);
      padding: 0 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .status-right { display: flex; gap: 10px; align-items: center; }

    .tiny {
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 3px 7px;
      background: #fff;
      font-size: 12px;
    }

    a.inline-link { color: var(--accent); text-decoration: none; }
    a.inline-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="app">
    <div class="titlebar">
      <div class="title-left">
        <span class="excel-dot"></span>
        <div class="book-title">Sheet - Workbook</div>
      </div>
      <div class="search-wrap"><div class="search">Search for tools, help, and more</div></div>
      <div class="title-right">
        <div class="chip">Comments</div>
        <button class="share-btn">Share</button>
      </div>
    </div>

    <div class="tabs-row">
      <div class="rtab">File</div>
      <div class="rtab active">Home</div>
      <div class="rtab">Insert</div>
      <div class="rtab">Page Layout</div>
      <div class="rtab">Formulas</div>
      <div class="rtab">Data</div>
      <div class="rtab">Review</div>
      <div class="rtab">View</div>
      <div class="rtab">Help</div>
    </div>

    <div class="ribbon">
      <div class="group">
        <div class="group-body">
          <button class="btn" id="syncBtn">Sync</button>
          <button class="btn primary" id="saveBtn">Save</button>
          <a class="inline-link" href="/view" target="_blank">Read-only view</a>
        </div>
        <div class="group-label">Workbook</div>
      </div>

      <div class="group">
        <div class="group-body">
          <button class="btn" id="addRow">Insert Row</button>
          <button class="btn" id="addCol">Insert Column</button>
          <button class="btn" id="addSheet">New Sheet</button>
          <button class="btn" id="renameSheet">Rename Sheet</button>
        </div>
        <div class="group-label">Cells</div>
      </div>

      <div class="group">
        <div class="group-body">
          <button class="btn" id="exportBtn">Export CSV</button>
          <label class="btn">Import CSV <input id="importFile" type="file" accept=".csv" style="display:none"></label>
        </div>
        <div class="group-label">Data</div>
      </div>

      <div class="group">
        <div class="group-body">
          <span class="tiny" id="status">Ready</span>
        </div>
        <div class="group-label">Status</div>
      </div>
    </div>

    <div class="formula-row">
      <input id="nameBox" readonly value="A1" />
      <div class="fx">fx</div>
      <input id="formulaInput" placeholder="Formula bar (press Enter to apply)" />
    </div>

    <div class="sheet-area"><table id="grid"></table></div>

    <div class="tabs-strip" id="tabs"></div>

    <div class="status">
      <div>Workbook Statistics</div>
      <div class="status-right">
        <span>100%</span>
      </div>
    </div>
  </div>

  <script>
    let wb = { version: 2, sheet_order: ['Sheet1'], active_sheet: 'Sheet1', sheets: { Sheet1: { rows: 20, cols: 10, cells: {} } } };
    let selectedAddr = 'A1';

    const grid = document.getElementById('grid');
    const tabs = document.getElementById('tabs');
    const statusEl = document.getElementById('status');
    const formulaInput = document.getElementById('formulaInput');
    const nameBox = document.getElementById('nameBox');

    function setStatus(msg) { statusEl.textContent = msg; }

    function colLabel(idx) {
      let s = '';
      idx += 1;
      while (idx > 0) {
        const rem = (idx - 1) % 26;
        s = String.fromCharCode(65 + rem) + s;
        idx = Math.floor((idx - 1) / 26);
      }
      return s;
    }

    function addr(r, c) { return `${colLabel(c)}${r + 1}`; }
    function activeSheet() { return wb.sheets[wb.active_sheet]; }

    function ensureCell(a) {
      const s = activeSheet();
      if (!s.cells[a]) s.cells[a] = { raw: '', value: '' };
      return s.cells[a];
    }

    function renderTabs() {
      tabs.innerHTML = '';

      wb.sheet_order.forEach(name => {
        const t = document.createElement('div');
        t.className = 'sheet-tab' + (name === wb.active_sheet ? ' active' : '');
        t.textContent = name;
        t.onclick = () => {
          wb.active_sheet = name;
          selectedAddr = 'A1';
          render();
        };
        tabs.appendChild(t);
      });

      const add = document.createElement('div');
      add.className = 'sheet-tab';
      add.textContent = '+';
      add.title = 'Add sheet';
      add.onclick = () => document.getElementById('addSheet').click();
      tabs.appendChild(add);
    }

    function renderGrid() {
      const s = activeSheet();
      const thead = document.createElement('thead');
      const hr = document.createElement('tr');
      const corner = document.createElement('th');
      corner.className = 'corner';
      hr.appendChild(corner);

      for (let c = 0; c < s.cols; c++) {
        const th = document.createElement('th');
        th.textContent = colLabel(c);
        hr.appendChild(th);
      }
      thead.appendChild(hr);

      const tbody = document.createElement('tbody');
      for (let r = 0; r < s.rows; r++) {
        const tr = document.createElement('tr');
        const rh = document.createElement('td');
        rh.className = 'row-h';
        rh.textContent = String(r + 1);
        tr.appendChild(rh);

        for (let c = 0; c < s.cols; c++) {
          const a = addr(r, c);
          const td = document.createElement('td');
          td.className = 'cell';
          const input = document.createElement('input');
          const cell = s.cells[a] || { raw: '', value: '' };
          input.value = cell.raw;
          input.dataset.addr = a;
          input.title = String(cell.value ?? '');
          input.onfocus = () => selectCell(a);
          input.onchange = (e) => {
            ensureCell(a).raw = e.target.value;
            if (selectedAddr === a) formulaInput.value = e.target.value;
          };
          td.appendChild(input);
          tr.appendChild(td);
        }

        tbody.appendChild(tr);
      }

      grid.innerHTML = '';
      grid.appendChild(thead);
      grid.appendChild(tbody);
    }

    function selectCell(a) {
      selectedAddr = a;
      nameBox.value = a;
      formulaInput.value = (activeSheet().cells[a]?.raw) || '';
    }

    function render() {
      renderTabs();
      renderGrid();
      selectCell(selectedAddr);
    }

    async function loadWorkbook() {
      const r = await fetch('/api/sheet');
      wb = await r.json();
      if (!wb.active_sheet) wb.active_sheet = wb.sheet_order[0];
      if (!selectedAddr) selectedAddr = 'A1';
      render();
      setStatus('Loaded');
    }

    async function saveWorkbook() {
      setStatus('Saving...');
      const r = await fetch('/api/sheet', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(wb)
      });
      const data = await r.json();
      wb = data;
      render();
      if (data.git_sync?.ok) setStatus('Saved + pushed');
      else setStatus('Saved local, git push failed');
    }

    async function syncNow() {
      setStatus('Syncing...');
      const r = await fetch('/api/sync', { method: 'POST' });
      const data = await r.json();
      if (data.ok) {
        await loadWorkbook();
        setStatus('Synced');
      } else {
        setStatus('Sync failed');
      }
    }

    document.getElementById('addRow').onclick = () => { activeSheet().rows += 1; render(); };
    document.getElementById('addCol').onclick = () => { activeSheet().cols += 1; render(); };
    document.getElementById('saveBtn').onclick = saveWorkbook;
    document.getElementById('syncBtn').onclick = syncNow;

    document.getElementById('addSheet').onclick = () => {
      let i = 1;
      while (wb.sheets[`Sheet${i}`]) i++;
      const name = `Sheet${i}`;
      wb.sheets[name] = { rows: 20, cols: 10, cells: {} };
      wb.sheet_order.push(name);
      wb.active_sheet = name;
      selectedAddr = 'A1';
      render();
    };

    document.getElementById('renameSheet').onclick = () => {
      const oldName = wb.active_sheet;
      const newName = prompt('New sheet name:', oldName);
      if (!newName || newName === oldName || wb.sheets[newName]) return;
      wb.sheets[newName] = wb.sheets[oldName];
      delete wb.sheets[oldName];
      wb.sheet_order = wb.sheet_order.map(n => n === oldName ? newName : n);
      wb.active_sheet = newName;
      render();
    };

    formulaInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        ensureCell(selectedAddr).raw = formulaInput.value;
        render();
      }
    });

    document.getElementById('exportBtn').onclick = () => {
      window.location.href = `/api/export.csv?sheet=${encodeURIComponent(wb.active_sheet)}`;
    };

    document.getElementById('importFile').addEventListener('change', async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const form = new FormData();
      form.append('file', f);
      form.append('sheet', wb.active_sheet);
      setStatus('Importing...');
      const r = await fetch('/api/import.csv', { method: 'POST', body: form });
      wb = await r.json();
      render();
      if (wb.git_sync?.ok) setStatus('Imported + pushed');
      else setStatus('Imported local, git push failed');
      e.target.value = '';
    });

    loadWorkbook();
  </script>
</body>
</html>
