<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sheet - Read Only</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; }
    .grid-wrap { overflow: auto; border: 1px solid #ddd; max-height: 80vh; }
    table { border-collapse: collapse; width: max-content; min-width: 100%; }
    th, td { border: 1px solid #ddd; min-width: 100px; height: 28px; padding: 6px; }
    th { background: #f5f5f5; position: sticky; top: 0; z-index: 2; }
    td.row-header { background: #f5f5f5; text-align: right; padding-right: 8px; position: sticky; left: 0; z-index: 1; }
    th.corner { left: 0; z-index: 3; position: sticky; }
  </style>
</head>
<body>
  <h2>Sheet (Read-only)</h2>
  <div class="grid-wrap"><table id="grid"></table></div>
  <script>
    function colLabel(idx) {
      let s = '';
      idx += 1;
      while (idx > 0) {
        const rem = (idx - 1) % 26;
        s = String.fromCharCode(65 + rem) + s;
        idx = Math.floor((idx - 1) / 26);
      }
      return s;
    }
    function addr(r, c) { return `${colLabel(c)}${r+1}`; }

    async function run() {
      const model = await (await fetch('/api/sheet')).json();
      const grid = document.getElementById('grid');

      const thead = document.createElement('thead');
      const hr = document.createElement('tr');
      const corner = document.createElement('th');
      corner.className = 'corner';
      hr.appendChild(corner);
      for (let c = 0; c < model.cols; c++) {
        const th = document.createElement('th');
        th.textContent = colLabel(c);
        hr.appendChild(th);
      }
      thead.appendChild(hr);

      const tbody = document.createElement('tbody');
      for (let r = 0; r < model.rows; r++) {
        const tr = document.createElement('tr');
        const rh = document.createElement('td');
        rh.className = 'row-header';
        rh.textContent = String(r+1);
        tr.appendChild(rh);
        for (let c = 0; c < model.cols; c++) {
          const td = document.createElement('td');
          const cell = model.cells[addr(r,c)] || { value: '' };
          td.textContent = cell.value ?? '';
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }

      grid.appendChild(thead);
      grid.appendChild(tbody);
    }
    run();
  </script>
</body>
</html>
